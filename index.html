<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">

<title>הפיליפינים 2026</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:linear-gradient(135deg,#0b6b5e,#2a9d8f 55%,#e76f51);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
  }
  .box{
    background:#fff;border-radius:20px;padding:36px 28px;width:90%;max-width:360px;
    text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.18);
  }
  h1{font-size:1.4rem;color:#0b6b5e;margin-bottom:6px;}
  p{color:#5d6b73;font-size:.9rem;margin-bottom:24px;}
  input{
    width:100%;padding:13px 16px;border:2px solid #e3e8ec;border-radius:12px;
    font-size:1.1rem;text-align:center;letter-spacing:4px;outline:none;
    font-family:inherit;transition:border .2s;
  }
  input:focus{border-color:#0b6b5e;}
  button{
    margin-top:14px;width:100%;padding:13px;background:linear-gradient(135deg,#0b6b5e,#2a9d8f);
    color:#fff;border:0;border-radius:12px;font-size:1rem;font-weight:700;
    cursor:pointer;font-family:inherit;transition:opacity .2s;
  }
  button:hover{opacity:.88;}
  .err{color:#e63946;font-size:.88rem;margin-top:10px;min-height:20px;}
  .spin{display:none;margin-top:12px;color:#2a9d8f;}
  .emoji{font-size:2.8rem;margin-bottom:10px;}
</style>
</head>

function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}

async function decrypt(){
  const pw = document.getElementById('pw').value;
  if(!pw){document.getElementById('err').textContent='נא להזין סיסמה';return;}
  document.getElementById('spin').style.display='block';
  document.getElementById('err').textContent='';
  try{
    const keyMat = await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(SALT),iterations:600000,hash:'SHA-256'},
      keyMat,{name:'AES-GCM',length:256},false,['decrypt']
    );
    const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));
    const html = new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('spin').style.display='none';
    document.getElementById('err').textContent='❌ סיסמה שגויה';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}

document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')decrypt();});
</script>
